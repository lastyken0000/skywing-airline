<title>放置エアライン</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="路線を引き、機体を買い、世界へ広げる放置系エアライン経営ゲーム">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* デザイン: 夜間飛行の航空図。群青の海に琥珀色の機影、計器の数字にはB612 Mono */
:root {
  --ink: #0a1020;
  --ocean: #0b1730;
  --land: #172a47;
  --coast: #2c4a78;
  --border: #22395c;
  --grat: rgba(120, 160, 220, 0.09);
  --panel: #0f1a30;
  --panel2: #142240;
  --panel3: #1b2d50;
  --edge: #263c63;
  --fg: #e9eefb;
  --mute: #8ea3c8;
  --amber: #ffb347;
  --cyan: #54d2ff;
  --route: #54d2ff;
  --lock: #3b4d72;
  --green: #53e3a2;
  --red: #ff6f7d;
  --mono: 'B612 Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --sans: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', Meiryo, system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: #050914; color: var(--fg); font: 14px/1.5 var(--sans); overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
h2, h3, p, dl, dd, ol { margin: 0; }
.mono { font-family: var(--mono); }
.pos { color: var(--green); }
.neg { color: var(--red); }
.sub { color: var(--mute); font-size: 12px; }

#root { height: 100%; }
.app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; background: var(--ink); position: relative; overflow: hidden; box-shadow: 0 0 0 1px #0d1630; }
.band-in { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 上部バー */
.hud { background: var(--panel); border-bottom: 1px solid var(--edge); }
.hud-in { display: flex; align-items: center; gap: 12px; padding-block: 8px; }
.ring { width: 46px; height: 46px; border-radius: 50%; background: conic-gradient(var(--amber) var(--p), var(--edge) 0); display: grid; place-items: center; position: relative; flex: none; }
.ring::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--panel); }
.ring span, .ring small { position: relative; grid-area: 1 / 1; font-family: var(--mono); }
.ring span { font-size: 16px; font-weight: 700; margin-top: -5px; }
.ring small { font-size: 8px; color: var(--mute); margin-top: 17px; letter-spacing: .12em; }
.who { flex: 1; min-width: 0; }
.airline { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.miles { color: var(--mute); font-size: 12px; }
.miles b { font-family: var(--mono); color: var(--cyan); font-weight: 400; font-variant-numeric: tabular-nums; }
.cash { text-align: right; line-height: 1.15; }
.cash small { display: block; color: var(--mute); font-size: 10px; letter-spacing: .1em; }
.cash b { font-family: var(--mono); font-size: 20px; color: var(--amber); font-variant-numeric: tabular-nums; }

/* 地図 */
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.mapbox { position: absolute; inset: 0; background: var(--ocean); touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.map { width: 100%; height: 100%; display: block; }
.land { fill: var(--land); fill-rule: evenodd; stroke: var(--coast); stroke-width: 0.8px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.border { fill: none; stroke: var(--border); stroke-width: 0.6px; vector-effect: non-scaling-stroke; }
.grat { stroke: var(--grat); stroke-width: 1px; vector-effect: non-scaling-stroke; }
.rline { stroke: var(--route); stroke-width: 1.6px; stroke-dasharray: 5 5; opacity: .7; vector-effect: non-scaling-stroke; pointer-events: none; }
.rline.sel { stroke: var(--amber); opacity: 1; stroke-width: 2.2px; }
.bline { stroke: var(--amber); stroke-width: 2px; stroke-dasharray: 3 4; vector-effect: non-scaling-stroke; pointer-events: none; }
.bline.close { opacity: .45; }
.ap { cursor: pointer; }
.ap .dot { fill: var(--cyan); stroke: var(--ink); }
.ap.locked .dot { fill: var(--lock); }
.ap.on .dot { fill: var(--amber); }
.aplabel, .apnum { font-family: var(--mono); text-anchor: middle; paint-order: stroke; stroke: var(--ocean); stroke-linejoin: round; pointer-events: none; }
.aplabel { fill: var(--fg); }
.ap.locked .aplabel { fill: var(--mute); }
.apnum { fill: var(--amber); font-weight: 700; }
.hubring, .selring { fill: none; stroke: var(--amber); opacity: .85; }
.hubring { stroke-dasharray: 2 2; }
.hit { fill: transparent; }
.plane { pointer-events: none; }
.plane path { fill: var(--amber); stroke: var(--ink); stroke-linejoin: round; }
.plane.ground { opacity: .7; }
.fx { position: absolute; transform: translate(-50%, -50%); font: 700 12px var(--mono); color: var(--green); text-shadow: 0 1px 3px #000, 0 0 6px #000; animation: rise 1.5s ease-out forwards; pointer-events: none; white-space: nowrap; }
.fx.neg { color: var(--red); }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -230%); } }

.ov { position: absolute; top: 10px; z-index: 3; display: flex; flex-direction: column; gap: 8px; }
.ov.left { left: max(12px, env(safe-area-inset-left, 0px)); align-items: flex-start; }
.ov.right { right: max(12px, env(safe-area-inset-right, 0px)); }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: rgba(10, 16, 32, .88); border: 1px solid var(--edge); border-radius: 10px; }
.seg button { min-height: 34px; min-width: 44px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--mute); font-family: var(--mono); font-weight: 700; }
.seg button.on { background: var(--amber); color: #1b1200; }
.seg.wide { display: flex; width: 100%; }
.seg.wide button { flex: 1; font-family: var(--sans); font-size: 12px; min-width: 0; padding: 0 4px; }
.seg em { font-style: normal; font-size: 9px; margin-left: 4px; padding: 1px 4px; border-radius: 4px; background: rgba(83, 227, 162, .18); color: var(--green); }
.seg button.on em { background: rgba(0, 0, 0, .15); color: #1b1200; }
.pill { display: flex; flex-direction: column; padding: 6px 10px; background: rgba(10, 16, 32, .88); border: 1px solid var(--edge); border-radius: 10px; font-size: 11px; color: var(--mute); line-height: 1.3; }
.pill b { font-family: var(--mono); font-size: 15px; color: var(--green); font-weight: 700; }
.pill b.neg { color: var(--red); }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--edge); background: rgba(10, 16, 32, .88); color: var(--fg); padding: 0; }
.iconbtn.sm { width: 36px; height: 36px; border-radius: 10px; }
.hud .iconbtn { background: var(--panel2); }

.toasts { position: absolute; top: 108px; left: 50%; transform: translateX(-50%); width: min(88%, 420px); display: grid; gap: 6px; z-index: 6; pointer-events: none; }
.toast { padding: 8px 12px; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; font-size: 13px; box-shadow: 0 6px 20px rgba(0, 0, 0, .45); }
.toast.good { border-color: var(--green); }
.toast.warn { border-color: var(--amber); }

/* 地図の上のカード */
.dock { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; z-index: 4; display: grid; gap: 8px; padding: 12px; background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }
.dock-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.dock-title b { font-size: 15px; }
.dock-title span { font-size: 12px; color: var(--mute); }
.dock.hint ol { padding-left: 18px; display: grid; gap: 2px; font-size: 13px; }
.stops { display: flex; flex-wrap: wrap; gap: 6px; }
.stop { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-radius: 999px; background: var(--panel3); font-family: var(--mono); font-size: 13px; }
.stop i { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; background: var(--amber); color: #1b1200; font-style: normal; font-size: 11px; font-weight: 700; }
.demand { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 12px; color: var(--mute); }
.demand b { color: var(--fg); }

/* シート */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; height: min(68%, 600px); z-index: 5; display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--edge); border-radius: 16px 16px 0 0; box-shadow: 0 -12px 32px rgba(0, 0, 0, .45); animation: slide .2s ease-out; }
@keyframes slide { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.sheet-head h2 { font-size: 17px; }
.sheet-head p { font-size: 12px; color: var(--mute); }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; display: grid; gap: 10px; align-content: start; padding: 2px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); }
.toolrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.card { display: grid; gap: 8px; padding: 12px; background: var(--panel2); border: 1px solid var(--edge); border-radius: 12px; min-width: 0; }
.card.focus { border-color: var(--amber); }
.card.locked { opacity: .62; }
.card.open { border-color: #2c5c52; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-width: 0; }
.card-top h3 { font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.card-top h3.mono { font-size: 13px; }
.card-foot { display: flex; justify-content: flex-end; }
.rate { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
.tag { margin-left: 6px; font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--mute); }
.badge { flex: none; max-width: 55%; padding: 2px 8px; border-radius: 999px; background: var(--panel3); color: var(--mute); font-size: 11px; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge.on { color: var(--green); background: rgba(83, 227, 162, .12); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
.kv dt { font-size: 11px; color: var(--mute); }
.kv dd { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.cond { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 12px; color: var(--mute); }
.cond b { font-family: var(--mono); color: var(--fg); font-weight: 400; min-width: 3ch; text-align: right; }
.meter { height: 6px; border-radius: 3px; background: var(--edge); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--green); border-radius: 3px; }
.meter.warn i { background: var(--amber); }
.meter.bad i { background: var(--red); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions select { flex: 1 1 140px; min-width: 0; }
.btn, select, input[type=text], input[type=search] { min-height: 40px; border-radius: 10px; border: 1px solid var(--edge); background: var(--panel3); padding: 0 14px; }
select { padding: 0 8px; }
.btn.small { min-height: 32px; padding: 0 10px; font-size: 12px; }
.btn.block { width: 100%; }
.btn.primary { background: var(--amber); border-color: var(--amber); color: #1b1200; font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.danger { background: rgba(255, 111, 125, .14); border-color: var(--red); color: var(--red); font-weight: 700; }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; min-height: 36px; }
.switch input { width: 20px; height: 20px; accent-color: var(--amber); }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--mute); }
.field input { color: var(--fg); font-size: 15px; width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border-radius: 999px; background: var(--panel3); font-size: 12px; }
.chip button { width: 24px; height: 24px; border: 0; border-radius: 50%; background: transparent; color: var(--mute); }
.hintline { font-size: 11px; color: var(--mute); }
.picker { display: grid; gap: 6px; }
.pick { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; text-align: left; border: 1px dashed var(--edge); border-radius: 10px; background: transparent; font-size: 13px; }
.pick small { color: var(--mute); font-family: var(--mono); font-size: 11px; }
.buyrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.price { font-family: var(--mono); font-size: 17px; color: var(--amber); }
.lockmsg { font-size: 12px; color: var(--mute); }
.codes { display: flex; flex-wrap: wrap; gap: 4px; }
.code { padding: 1px 6px; border-radius: 4px; background: var(--panel3); font-family: var(--mono); font-size: 11px; color: var(--mute); }
.empty { display: grid; gap: 10px; justify-items: start; color: var(--mute); padding: 6px 0; }

/* 空港検索 */
.searchbox { width: 100%; color: var(--fg); font-size: 15px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.rc { flex: none; min-height: 34px; padding: 0 12px; border: 1px solid var(--edge); border-radius: 999px; background: transparent; color: var(--mute); font-size: 12px; }
.rc.on { background: var(--amber); border-color: var(--amber); color: #1b1200; font-weight: 700; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; min-height: 54px; padding: 6px 10px; text-align: left; border: 1px solid var(--edge); border-radius: 10px; background: var(--panel2); }
.row.locked { opacity: .72; }
.codes2 { display: grid; min-width: 3.6em; font-family: var(--mono); line-height: 1.25; }
.codes2 b { font-size: 15px; color: var(--cyan); }
.codes2 small { font-size: 10px; color: var(--mute); }
.rowmain { display: grid; min-width: 0; }
.rowmain b { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rowmain small { font-size: 11px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub.warn { color: var(--amber); }

/* ナビ */
.nav { background: var(--panel); border-top: 1px solid var(--edge); }
.nav-in { display: grid; grid-template-columns: repeat(5, 1fr); }
.nav-btn { display: grid; gap: 2px; justify-items: center; align-content: center; min-height: 58px; border: 0; background: transparent; color: var(--mute); font-size: 11px; position: relative; padding: 0; }
.nav-btn.on { color: var(--amber); }
.nav-btn.on::before { content: ''; position: absolute; top: 0; left: 28%; right: 28%; height: 2px; background: var(--amber); border-radius: 0 0 2px 2px; }

/* モーダル */
.scrim { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(3, 6, 14, .72); }
.modal { display: grid; gap: 12px; width: min(440px, 100%); max-height: 100%; overflow: auto; padding: 18px; background: var(--panel); border: 1px solid var(--edge); border-radius: 16px; }
.modal h2 { font-size: 18px; }
.bigcash { font-family: var(--mono); font-size: 36px; font-weight: 700; color: var(--amber); }

@media (prefers-reduced-motion: reduce) {
  .sheet { animation: none; }
  .fx { animation: none; opacity: 1; }
}

.tier-head{margin:14px 2px 2px;font-size:12px;letter-spacing:.08em;color:var(--amber);font-weight:700}

/* おかえり画面: 出発案内板 + 搭乗券 */
.ob-scrim { background: radial-gradient(120% 70% at 50% 100%, rgba(255,179,71,.10), rgba(2,4,10,.94)); backdrop-filter: blur(3px); }
.ob-wrap { display: grid; gap: 12px; width: min(400px, 100%); max-height: 100%; overflow: auto; padding: 2px; animation: ob-in .45s cubic-bezier(.2,.9,.3,1.05) both; }
.ob-board { border-radius: 14px; background: #06080d; border: 1px solid #2a3140; box-shadow: 0 14px 40px rgba(0,0,0,.6), inset 0 0 0 3px #0d1119; padding: 12px 12px 10px; }
.ob-board header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid #1f2633; }
.ob-board header b { font-size: 14px; letter-spacing: .12em; color: #ffd36b; }
.ob-board header span { font-family: var(--mono); font-size: 11px; color: #7f8ca6; }
.ob-cols { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; padding: 6px 0 4px; font-size: 10px; letter-spacing: .2em; color: #566179; }
.ob-cols span:nth-child(2) { width: 46px; text-align: right; } .ob-cols span:nth-child(3) { width: 108px; text-align: right; }
.ob-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 3px 0; }
.ob-flip { display: inline-flex; gap: 2px; justify-content: flex-start; }
.ob-flip i { position: relative; display: grid; place-items: center; width: 14px; height: 22px; border-radius: 3px; background: linear-gradient(180deg, #1a2030 0 49%, #0c1019 51% 100%); font: 700 14px var(--mono); font-style: normal; color: #e8eefc; }
.ob-flip i::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #000; opacity: .85; }
.ob-flip i.sp { background: transparent; } .ob-flip i.sp::after { display: none; }
.ob-flip i:not(.ok):not(.sp) { color: #6f7da0; }
.ob-flip.gold i { color: #ffd36b; } .ob-flip.neg i { color: #ff7a88; }
.ob-flip.gold i:not(.ok):not(.sp), .ob-flip.neg i:not(.ok):not(.sp) { color: #7d6a3e; }
.ob-row .ob-flip:first-child { min-width: 0; }
.ob-more { margin: 6px 0 0; text-align: right; font-family: var(--mono); font-size: 12px; color: #8ea3c8; }
.ob-none { margin: 10px 0; text-align: center; color: #7f8ca6; font-size: 13px; }
.ob-tearzone { position: relative; }
.ob-ticket { position: relative; display: grid; border-radius: 16px; color: #2a2113; background: linear-gradient(135deg, #f7f0e0, #eadfc4); box-shadow: 0 10px 30px rgba(0,0,0,.55); -webkit-mask: radial-gradient(circle 11px at 0 var(--notch, 67%), #0000 98%, #000) , radial-gradient(circle 11px at 100% var(--notch, 67%), #0000 98%, #000); -webkit-mask-composite: source-in; mask: radial-gradient(circle 11px at 0 var(--notch, 67%), #0000 98%, #000), radial-gradient(circle 11px at 100% var(--notch, 67%), #0000 98%, #000); mask-composite: intersect; transition: background .5s; }
.ob-ticket.first { background: linear-gradient(135deg, #ffe9a6, #e0a73a 55%, #f6cf6c); }
.ob-main { position: relative; padding: 14px 16px 12px; display: grid; gap: 10px; }
.ob-th { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2px solid #2a2113; padding-bottom: 6px; }
.ob-th b { font-family: var(--mono); letter-spacing: .18em; font-size: 13px; } .ob-th span { font-size: 12px; font-weight: 700; }
.ob-fields { display: grid; grid-template-columns: 1.5fr 1fr; gap: 8px 14px; margin: 0; }
.ob-fields div { min-width: 0; } .ob-fields dt { font-size: 9px; letter-spacing: .18em; color: #8a7a55; } .ob-fields dd { margin: 0; font-family: var(--mono); font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ob-ticket.first .ob-fields dt { color: #7a5a14; }
.ob-stamps { display: flex; gap: 12px; padding: 2px 0 0; }
.ob-stamp { display: inline-flex; align-items: baseline; gap: 4px; padding: 3px 9px; border: 2px solid #c8323f; border-radius: 6px; color: #c8323f; font: 700 10px var(--mono); letter-spacing: .12em; transform: rotate(-4deg); animation: ob-stamp .35s .9s cubic-bezier(.3,1.6,.5,1) both; }
.ob-stamp b { font-size: 16px; line-height: 1; }
.ob-stamp.up { --r: 4deg; border-color: #7a3d00; color: #7a3d00; animation-delay: 0s; }
.ob-perf { height: 0; border-top: 2px dashed rgba(42,33,19,.45); margin: 0 14px; position: relative; top: 0; }
.ob-stub { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 14px; }
.ob-stub small { display: block; font-size: 9px; letter-spacing: .2em; color: #8a7a55; } .ob-ticket.first .ob-stub small { color: #7a5a14; }
.ob-stub b { font-family: var(--mono); font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }

    { id: 'la',  group: 'world', name: '中南米',             cost: 7800, level: 16, lbl: [-60, -14] },
    { id: 'oc',  group: 'world', name: 'オセアニア',         cost: 10200, level: 18, lbl: [140, -27] },
    { id: 'af',  group: 'world', name: 'アフリカ',           cost: 13200, level: 21, lbl: [20, 4] },
  ];
  const START_REGIONS = ['kansai'];
  // 隣のエリア: どれか1つが解放済みなら解放できる(日本は地方の並び、世界は近い地域。東アジアは日本のどこかから)
  const NEIGHBORS = (() => {
    const edges = [['hokkaido', 'tohoku'], ['tohoku', 'kanto'], ['tohoku', 'chubu'], ['kanto', 'chubu'], ['chubu', 'kansai'], ['kansai', 'chugoku'], ['kansai', 'shikoku'],
      ['chugoku', 'shikoku'], ['chugoku', 'kyushu'], ['shikoku', 'kyushu'],
      ['ea', 'sea'], ['ea', 'sa'], ['ea', 'na'], ['sea', 'sa'], ['sea', 'oc'], ['sa', 'me'], ['me', 'eu'], ['me', 'af'], ['eu', 'af'], ['eu', 'na'], ['na', 'la'], ['la', 'af'], ['la', 'oc']];
    const m = {};
    REGIONS.forEach((r) => { m[r.id] = new Set(); });
    edges.forEach(([a, b]) => { m[a].add(b); m[b].add(a); });
    const jp = REGIONS.filter((r) => r.group === 'jp').map((r) => r.id);
    jp.forEach((a) => { if (a !== 'island') m.island.add(a); m[a].add('island'); });     // 離島はどの地方からでも
    m.island.delete('island');
    jp.forEach((a) => m.ea.add(a));                                                    // 東アジアは日本のどこかから(逆はなし)
    return Object.fromEntries(Object.entries(m).map(([k, v]) => [k, [...v]]));
  })();


  // 空港データ(世界5,921空港)。配列の順番が重要度順。
  // [IATA(3文字), ICAO(4文字), 名称, 都市・エリア, 国コード, 地域ID, 緯度, 経度, 需要x100, 英語名(日本語化した空港のみ), 都道府県(日本のみ)]
  const AIRPORTS = AIRPORT_DATA.map(([id, icao, name, city, cc, region, lat, lon, dem, en, pref]) => ({ id, icao, name, city, cc, region, lat, lon, demand: dem / 100, en: en || '', pref: pref || '' }));

  // 機体データ(50機種)。[id, 名称, ティア, 座席, 巡航km/h, 航続km, 価格, 解禁Lv, 運賃倍率] tools/build-planes.mjs で生成
  const PLANES = PLANE_DATA.map(([id, name, tier, seats, speed, range, price, level, fm]) => ({ id, name, tier, seats, speed, range, price, level, fm }));
  const TIER_NAMES = ['小型プロップ', '中型プロップ', 'リージョナルジェット', '大型リージョナル', 'ナローボディ', '大型ナロー', '中型ワイド', '大型ワイド', '超大型ワイド', 'フラッグシップ'];


  // ---------- 空港の種類とレベル ----------
  // 種類: hub=国際ハブ / intl=国際空港 / dom=国内空港 / remote=小空港・離島。国際線は hub と intl の間だけ
  const JP_HUB = new Set(['HND', 'NRT', 'KIX']);
  const JP_INTL = new Set(['NGO', 'CTS', 'FUK', 'OKA', 'HKD', 'AKJ', 'SDJ', 'KIJ', 'TOY', 'KMQ', 'FSZ', 'UKB', 'OKJ', 'HIJ', 'TAK', 'MYJ', 'KKJ', 'HSG', 'NGS', 'KMJ', 'OIT', 'KOJ', 'ISG', 'AOJ', 'AXT', 'IBR', 'YGJ', 'MMY']);
  const KIND_LABEL = { hub: '国際ハブ', intl: '国際空港', dom: '国内空港', remote: '小空港・離島' };
  function kindOf(a) {
    if (a.cc === 'JP') return JP_HUB.has(a.id) ? 'hub' : JP_INTL.has(a.id) ? 'intl' : a.region === 'island' && a.demand < 0.95 ? 'remote' : 'dom';
    return a.demand >= 1.2 ? 'hub' : a.demand >= 1.0 ? 'intl' : a.demand >= 0.6 ? 'dom' : 'remote';
  }
  AIRPORTS.forEach((a) => {
    a.kind = kindOf(a);
    a.intl = a.kind === 'hub' || a.kind === 'intl';
    a.maxLv = a.kind === 'hub' ? 10 : a.kind === 'intl' ? (a.demand >= 0.9 ? 7 : 6) : a.kind === 'dom' ? (a.demand >= 1.0 ? 5 : a.demand >= 0.72 ? 4 : 3) : 2;
  });
  let levelOf = () => 1;                                   // 空港レベルの参照元(ゲーム状態から差し込む)
  const setLevelSource = (f) => { levelOf = f; };
  const lvMult = (a) => 1 + 0.2 * (levelOf(a) - 1);
  const LV = {
    mult: (L) => 1 + 0.2 * (L - 1),                        // 客数
    slots: (L) => 1 + L,                                   // 発着できる路線数
    maxLeg: (L) => [800, 1500, 2500, 3500, 4500, 6000, 8000, 11000, 14000, 99999][Math.min(10, L) - 1],   // つなげる最長距離(km)
    tier: (L) => Math.min(10, L + 1),                      // 受け入れられる機体のティア
    cost: (a, L) => Math.round(20000 * (0.6 + a.demand) * Math.pow(2.3, L - 1)),   // L → L+1 の費用
  };

  const MODES = [
    { name: 'エコノミー', short: 'ECO', fare: 0.85 },
    { name: '標準', short: 'STD', fare: 1.0 },
    { name: 'ラグジュアリー', short: 'LUX', fare: 1.9 },
  ];

  const rad = Math.PI / 180;
  const distCache = new Map();
  function dist(a, b) {
    const key = a.id + b.id;
    let d = distCache.get(key);
    if (d !== undefined) return d;
    const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
    d = 2 * 6371 * Math.asin(Math.min(1, Math.sqrt(s)));
    distCache.set(key, d);
    return d;
  }

  const baseLF = (a, b, m = 1) => Math.min(0.98, 0.5 + 0.3 * Math.sqrt(a.demand * b.demand * m));
  // 1便あたりの旅客数の上限。大きな機体は、需要の小さい路線では埋まらない
  const paxPool = (a, b, d, m = 1) => 110 * a.demand * b.demand * m * (0.5 + Math.min(d, 8000) / 4000);
  const groundTime = (type) => 10 + type.seats / 30;   // 地上時間(リアル秒)。大型機ほど長い。短距離の往復で稼ぎすぎないよう長めにしてある
  function modeLF(base, mode) {
    if (mode === 0) return Math.min(0.98, base + 0.25);                     // 安く売れば埋まる
    if (mode === 1) return base;
    return Math.max(0.1, Math.min(0.95, (base - 0.55) * 2.2));              // 高需要の区間だけ埋まる
  }
  const fareOf = (d, mode) => (30 + 0.15 * d) * MODES[mode].fare;
  const legTime = (type, d) => (d / type.speed) * 3600 / TS;
  const condRev = (c) => (c >= 50 ? 1 : 0.55 + c / 111);
  const condCost = (c) => (c < 30 ? 1 + (30 - c) / 20 : 1);

  // 1区間の収支。hub はハブ収益ボーナス(0〜0.3)
  function leg(type, a, b, mode, cond, hub) {
    const d = dist(a, b);
    const m = lvMult(a) * lvMult(b);                                   // 空港レベルによる客数の増加
    const lf = Math.min(modeLF(baseLF(a, b, m), mode), paxPool(a, b, d, m) / type.seats);
    const fare = fareOf(d, mode) * (type.fm || 1);
    const rev = type.seats * lf * fare * condRev(cond) * (1 + hub);
    const cost = (type.seats * d * 0.028 + 300 + type.seats * 3) * condCost(cond);   // 燃料 + 着陸料(固定+座席あたり)
    return { d, lf, fare, rev, cost, net: rev - cost, time: legTime(type, d) };
  }

  const xpToReach = (L) => Math.round(260 * Math.pow(L - 1, 2.0));
  const xpPerLeg = (d) => 1 + d / 500;
  const milesPerLeg = (d) => Math.round(d / 80);

  return { NEIGHBORS, LV, KIND_LABEL, setLevelSource, TS, REGIONS, START_REGIONS, AIRPORTS, PLANES, TIER_NAMES, MODES, dist, baseLF, modeLF, fareOf, legTime, groundTime, paxPool, leg, xpToReach, xpPerLeg, milesPerLeg };
})();

    W('na', '北米', '太平洋の架け橋', '太平洋を越えて、アメリカへ。', 'LAX', '長い距離を飛べる大きな機体が必要になる。ロサンゼルスを目指そう。', [8, 400000, 80, 30000]),

    W('la', '中南米', '地球の裏側の翼', '地球の裏側まで、翼を伸ばそう。', 'GRU', '日本から最も遠い空。サンパウロへの長い空の道を作ろう。', [10, 700000, 110, 50000]),
    W('oc', 'オセアニア', '南十字星の翼', '南半球の、青い海と大地へ。', 'SYD', '季節が逆さまの国。シドニーの空港を目指そう。', [10, 800000, 120, 55000]),

<script>
// 放置エアライン: ゲーム状態・運航シミュレーション・操作(画面に依存しない)

  const AP = {};

  // 国名(日本語)。ブラウザの Intl.DisplayNames を使い、使えない環境では国コードのまま表示
  const countryName = (() => {

    try { dn = new Intl.DisplayNames(['ja'], { type: 'region' }); } catch (e) { dn = null; }
    const cache = {};
    return (cc) => {
      if (cache[cc]) return cache[cc];
      let n = cc;
      try { n = (dn && dn.of(cc)) || cc; } catch (e) { n = cc; }
      cache[cc] = n;
      return n;
    };
  })();
  const placeOf = (a) => (a.cc === 'JP' ? (a.pref || '日本') : countryName(a.cc)) + '・' + a.city;          // 国(日本は都道府県)・都市
  const regionCount = {};
  AIRPORTS.forEach((a) => { regionCount[a.region] = (regionCount[a.region] || 0) + 1; });
  // 空港検索: コード(IATA/ICAO)・名称・都市・国で部分一致。コード一致を優先し、同点は重要度順
  function searchAirports(query, region, limit, open) {
    const q = (query || '').trim().toLowerCase();
    const hits = [];
    for (let i = 0; i < AIRPORTS.length; i++) {
      const a = AIRPORTS[i];
      if (region && a.region !== region) continue;
      if (open && !open.includes(a.region)) continue;      // 未解放エリアの空港は見えない
      let score = 4;
      if (q) {
        if (!a.q) a.q = (a.id + ' ' + a.icao + ' ' + a.name + ' ' + a.city + ' ' + a.en + ' ' + countryName(a.cc) + ' ' + a.cc).toLowerCase();
        if (!a.q.includes(q)) continue;

    hits.sort((x, y) => x[0] - y[0] || x[1] - y[1]);

  const RT = { fx: [], fxId: 0, toasts: [], toastId: 0, acc: null, lvq: [], storyq: [], chapq: [], apq: [] };   // 保存しない一時状態
  let bump = () => {};
  const setBump = (f) => { bump = f; };

  function fmt(n) {
    const a = Math.abs(n), s = n < 0 ? '-' : '';

  const routeById = (g, id) => g.routes.find((r) => r.id === id) || null;
  const routeLegs = (r) => r.stops.map((s, i) => [AP[s], AP[r.stops[(i + 1) % r.stops.length]]]);

  const routeTotal = (r) => routeLegs(r).reduce((s, [a, b]) => s + dist(a, b), 0);

  const hubCount = (g, id) => g.routes.reduce((n, r) => n + (r.stops.includes(id) ? 1 : 0), 0);
  const hubBonus = (g, a, b) => Math.min(0.3, 0.1 * (Math.max(0, hubCount(g, a.id) - 2) + Math.max(0, hubCount(g, b.id) - 2)));
  const maxRoutes = (g) => 3 + g.level;
  // ---------- 空港レベル ----------
  CORE.setLevelSource((a) => (S.g && S.g.apLv && S.g.apLv[a.id]) || 1);
  const apLevel = (g, id) => (g.apLv && g.apLv[id]) || 1;
  const learnDiscount = (g, a) => { const d = dexOf(g, REGION[a.region]); return d.total ? 0.2 * (d.seen / d.total) : 0; };   // 訪れた土地が多いほど安い(最大20%)
  // ---------- 空港の建設(計画地 → 稼働) ----------
  const isBuilt = (g, id) => !!(g.built && g.built[id]);
  const buildCost = (g, a) => Math.round(LV.cost(a, 1) * 1.5 * (1 - learnDiscount(g, a)));
  function buildAirport(id) {
    const g = S.g, a = AP[id];
    if (!a || !g.regions.includes(a.region) || isBuilt(g, id)) return false;
    const c = buildCost(g, a);
    if (g.money < c) { toast('資金が足りません(建設費 ' + fmt(c) + ')', 'warn'); return false; }
    g.money -= c; g.built[id] = 1;
    RT.apq.push({ kind: 'build', id, name: a.name, from: 0, to: 1, cost: c });
    toast(a.name + ' の建設が完了しました', 'good');
    checkScenario(g, true);
    bump();
    return true;
  }
  function upgradeCost(g, a) {
    const L = apLevel(g, a.id);
    if (L >= a.maxLv) return null;
    const base = LV.cost(a, L), ld = learnDiscount(g, a);
    return { base, learn: ld, price: Math.round(base * (1 - ld)) };
  }
  function upgradeAirport(id) {
    const g = S.g, a = AP[id];
    if (!a || !g.regions.includes(a.region) || !isBuilt(g, id)) return false;
    const c = upgradeCost(g, a);
    if (!c) { toast(a.name + 'は最大レベルです', 'warn'); return false; }
    if (g.money < c.price) { toast('資金が足りません', 'warn'); return false; }
    g.money -= c.price;
    g.apLv = g.apLv || {}; const fromL = apLevel(g, id); g.apLv[id] = fromL + 1;
    RT.apq.push({ kind: 'up', id, name: a.name, from: fromL, to: fromL + 1, cost: c.price });
    toast(a.name + ' が Lv.' + g.apLv[id] + ' になりました', 'good');
    checkScenario(g, true);

  }
  // 路線の条件確認: 問題があれば理由の文章を返す。closing=trueで最後→最初の区間も調べる
  function routeCheck(g, stops, closing) {
    const aps = stops.map((id) => AP[id]);
    const nb = aps.find((a) => !isBuilt(g, a.id));
    if (nb) return nb.name + 'はまだ建設されていません(空港をタップして建設してください)';

        return a.id + '→' + b.id + ' は ' + fmtKm(d) + '。' + low.name + '(Lv.' + apLevel(g, low.id) + ')は ' + fmtKm(Math.min(la, lb)) + ' までしかつなげません。空港を強化してください';

      if (used + 1 > cap) return a.name + 'の発着枠がいっぱいです(Lv.' + apLevel(g, a.id) + ': ' + cap + '路線まで)。空港を強化してください';
    }

  const routeTierMax = (g, r) => Math.min(...r.stops.map((id) => LV.tier(apLevel(g, id))));
  function planeFit(g, p, r) { return typeFit(g, TYPE[p.type], r); }
  function typeFit(g, t, r) {                        // 機種を路線に使えるか。できない理由を返す
    if (t.range < routeMaxLeg(r)) return '航続距離が足りません(最長区間 ' + fmtKm(routeMaxLeg(r)) + ')';
    for (const id of r.stops) {

  const planesOn = (g, rid) => g.planes.filter((p) => p.route === rid);

  function planeRate(g, p) {                       // 現在の機体状態での毎分の純利益(1倍速)
    const r = routeById(g, p.route);

  const totalRate = (g) => g.planes.reduce((s, p) => s + (p.route ? planeRate(g, p) : 0), 0);

  const cheapestFor = (ml, tierMax = 10) => PLANES.filter((t) => t.range >= ml && t.tier <= tierMax).sort((a, b) => a.price - b.price)[0] || null;
  function refType(g, r) {                         // 推奨運賃の計算に使う代表機材
    const on = planesOn(g, r.id)[0];

    return MODES.map((_, m) => routeLegs(r).reduce((s, [a, b]) => s + leg(t, a, b, m, 100, 0).net, 0));

  }

  const DAY_START = 6 * 3600;                       // ゲーム開始は 1日目 6:00

  function clockText(g) {                           // 例: 「3日目 17:17」
    const s = Math.floor(g.gt % 86400), z = (n) => String(n).padStart(2, '0');

  function tickClock(g, realSecs) {                 // 実秒 → ゲーム内時間。日をまたいだら日別収益に確定

      for (let i = 0; i < n; i++) g.hist.push(per);

    }
  }
  function newGame() {
    const g = { v: 5, name: 'スカイウィング航空', money: 100000, miles: 0, xp: 0, level: 1, regions: CORE.START_REGIONS.slice(), seen: ['ITM', 'SHM'], built: { ITM: 1, SHM: 1 }, apLv: {},
      planes: [], routes: [], nextId: 1, speed: 1, autoMaint: true, lastSeen: Date.now(), legs: 0, earned: 0, hint: true, gt: DAY_START, hDay: 1, hist: [], dayNet: 0, year: 1968, boost: null, sc: { ch: {}, focus: null, titles: [] } };

  function save() {

  }
  function parseSave(s) {
    try {
      const g = JSON.parse(s);

      g.planes = g.planes.filter((p) => TYPE[p.type]);

  function goalProgress(g, id, goal) {

    if (k === 'legs') { cur = g.legs - st.start.legs; max = goal[1]; }
    else if (k === 'pax') { cur = Math.round((g.pax || 0) - st.start.pax); max = goal[1]; }
    else if (k === 'planes') { cur = g.planes.length; max = goal[1]; }
    else if (k === 'built') { cur = isBuilt(g, goal[1]) ? 1 : 0; }
    else if (k === 'builtN') { cur = (regionList[goal[1]] || []).filter((a) => isBuilt(g, a.id)).length; max = goal[2]; }
    else if (k === 'apLv') { cur = apLevel(g, goal[1]); max = goal[2]; }
    else if (k === 'routes') { cur = g.routes.length; max = goal[1]; }
    else if (k === 'routesIn') { cur = g.routes.filter((r) => r.stops.some((s) => AP[s].region === goal[1])).length; max = goal[2]; }
    else if (k === 'hub') { cur = hubCount(g, goal[1]); max = goal[2]; }
    else if (k === 'intl') { cur = g.routes.some((r) => new Set(r.stops.map((s) => AP[s].cc)).size > 1) ? 1 : 0; }

  }
  function goalText(goal) {
    const k = goal[0], nm = (id) => (AP[id] ? AP[id].name.replace(/\(.*\)/, '') : id), area = (id) => (REGION[id] ? REGION[id].name : id);
    if (k === 'legs') return goal[1] + '便を飛ばす';
    if (k === 'pax') return '乗客を累計' + fmtInt(goal[1]) + '人運ぶ';
    if (k === 'planes') return '機体を' + goal[1] + '機にする';
    if (k === 'built') return nm(goal[1]) + 'を建設する';

    if (k === 'apLv') return nm(goal[1]) + 'をLv.' + goal[2] + 'に強化する';
    if (k === 'routes') return '路線を' + goal[1] + '本にする';
    if (k === 'routesIn') return area(goal[1]) + 'の空港を使う路線を' + goal[2] + '本にする';

    plus: [P('M12 5v14M5 12h14', 1)],
    minus: [P('M5 12h14', 1)],
    target: [h('circle', { key: 1, cx: 12, cy: 12, r: 7 }), h('circle', { key: 2, cx: 12, cy: 12, r: 1.6 }), P('M12 2v3M12 19v3M2 12h3M19 12h3', 3)],
    close: [P('M6 6l12 12M18 6 6 18', 1)],

/* ---------------- 地図 ---------------- */
const LandDefs = memo(function LandDefs() {
  return h('defs', null,
    h('g', { id: 'land', transform: 'scale(0.01)' },
      h('path', { d: MAP.land, className: 'land' }),
      h('path', { d: MAP.borders, className: 'border', vectorEffect: 'non-scaling-stroke' })),
    // 解放エリアの形。解放済みは枠線で囲み、色をつける
    Object.keys(MAP.areas).map((id) => h('g', { key: id, id: 'ar-' + id, transform: 'scale(0.01)' }, h('path', { d: MAP.areas[id], vectorEffect: 'non-scaling-stroke', strokeLinejoin: 'round' }))));
});
const AreaLayer = memo(function AreaLayer({ open }) {
  const set = new Set(open.split(','));
  const ids = Object.keys(MAP.areas);
  const next = new Set(ids.filter((id) => !set.has(id) && CORE.NEIGHBORS[id] && CORE.NEIGHBORS[id].some((n) => set.has(n))));   // 次に解放できるエリア
  return h('g', null,
    ids.filter((id) => !set.has(id) && !next.has(id)).map((id) => h('use', { key: id, href: '#ar-' + id, className: 'area locked' })),
    ids.filter((id) => next.has(id)).map((id) => h('use', { key: id, href: '#ar-' + id, className: 'area next' })),
    ids.filter((id) => set.has(id)).map((id) => h('use', { key: id, href: '#ar-' + id, className: 'area open' })));
});
// エリア名の表示位置(日本は空港の中央値、世界は固定)
const AREA_LBL = (() => {
  const m = {};
  REGIONS.forEach((r) => {
    if (r.lbl) { m[r.id] = { x: r.lbl[0], y: mercY(r.lbl[1]) }; return; }
    if (MAP.lbl && MAP.lbl[r.id]) { m[r.id] = { x: MAP.lbl[r.id][0], y: MAP.lbl[r.id][1] }; return; }
    const xs = [], ys = [];
    AIRPORTS.forEach((a) => { if (a.region === r.id) { xs.push(a.x); ys.push(a.y); } });
    xs.sort((a, b) => a - b); ys.sort((a, b) => a - b);
    if (xs.length) m[r.id] = { x: xs[xs.length >> 1], y: ys[ys.length >> 1] };
  });
  return m;
})();
const Graticule = memo(function Graticule() {
  const els = [];
  for (let x = -540; x <= 540; x += 30) els.push(h('line', { key: 'x' + x, x1: x, x2: x, y1: -170, y2: 130, className: 'grat', vectorEffect: 'non-scaling-stroke' }));
  for (let lat = -60; lat <= 80; lat += 20) { const y = mercY(lat); els.push(h('line', { key: 'y' + lat, x1: -540, x2: 540, y1: y, y2: y, className: 'grat', vectorEffect: 'non-scaling-stroke' })); }
  return h('g', null, els);
});

function MapView({ g, ui, view, setView, onTap }) {
  const box = useRef(null);
  const [size, setSize] = useState({ w: 400, h: 480 });
  const viewRef = useRef(view);
  const sizeRef = useRef(size);
  viewRef.current = view; sizeRef.current = size;
  const ptrs = useRef(new Map());
  const gest = useRef({ moved: false, down: null, startDist: 0, startW: 0 });
  const tapRef = useRef(onTap);
  tapRef.current = onTap;

  useEffect(() => {
    const el = box.current;
    const upd = () => { const r = el.getBoundingClientRect(); if (r.width > 0) setSize({ w: r.width, h: r.height }); };
    upd();
    let ro = null;
    if (typeof ResizeObserver !== 'undefined') { ro = new ResizeObserver(upd); ro.observe(el); }
    window.addEventListener('resize', upd);
    const wheel = (e) => {
      e.preventDefault();
      const v = viewRef.current, s = sizeRef.current, rect = el.getBoundingClientRect();
      const k0 = v.w / s.w;
      const px = e.clientX - rect.left - s.w / 2, py = e.clientY - rect.top - s.h / 2;
      const nw = clamp(v.w * Math.exp(e.deltaY * 0.0015), 3.5, 360), k1 = nw / s.w;
      setView({ cx: wrapD(v.cx + px * (k0 - k1)), cy: clamp(v.cy + py * (k0 - k1), -95, 62), w: nw });
    };
    el.addEventListener('wheel', wheel, { passive: false });
    return () => { el.removeEventListener('wheel', wheel); window.removeEventListener('resize', upd); if (ro) ro.disconnect(); };
  }, []);

  const k = view.w / size.w;
  const vh = k * size.h;

  function down(e) {
    ptrs.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const gs = gest.current;
    if (ptrs.current.size === 1) { gs.moved = false; gs.down = { x: e.clientX, y: e.clientY }; }
    if (ptrs.current.size === 2) {
      const [a, b] = [...ptrs.current.values()];
      gs.startDist = Math.hypot(a.x - b.x, a.y - b.y) || 1; gs.startW = viewRef.current.w; gs.moved = true;
    }
  }
  function move(e) {
    const pr = ptrs.current.get(e.pointerId);
    if (!pr) return;
    const gs = gest.current, v = viewRef.current, kk = v.w / sizeRef.current.w;
    if (ptrs.current.size === 1) {
      const dx = e.clientX - pr.x, dy = e.clientY - pr.y;
      if (gs.down && Math.hypot(e.clientX - gs.down.x, e.clientY - gs.down.y) > 7) gs.moved = true;
      if (gs.moved && (dx || dy)) setView({ cx: wrapD(v.cx - dx * kk), cy: clamp(v.cy - dy * kk, -95, 62), w: v.w });
      pr.x = e.clientX; pr.y = e.clientY;
    } else if (ptrs.current.size === 2) {
      pr.x = e.clientX; pr.y = e.clientY;
      const [a, b] = [...ptrs.current.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      setView({ ...v, w: clamp(gs.startW * gs.startDist / d, 3.5, 360) });
    }
  }
  function up(e) { ptrs.current.delete(e.pointerId); }

  /* 描画要素 */
  const minX = view.cx - view.w / 2, maxX = view.cx + view.w / 2;
  const build = ui.build;
  const hubKey = g.routes.map((r) => r.stops.join('-')).join('|');
  const hubIds = useMemo(() => {
    const c = {};
    g.routes.forEach((r) => r.stops.forEach((st) => { c[st] = (c[st] || 0) + 1; }));
    return new Set(Object.keys(c).filter((id) => c[id] >= 3));
  }, [g, hubKey]);

  const lines = [];
  g.routes.forEach((r) => {
    const sel = ui.focusRoute === r.id;
    ENG.routeLegs(r).forEach(([a, b], i) => {
      lines.push(h('line', { key: r.id + '-' + i, x1: a.x, y1: a.y, x2: a.x + wrapD(b.x - a.x), y2: b.y, className: 'rline' + (sel ? ' sel' : ''), vectorEffect: 'non-scaling-stroke' }));
    });
  });
  if (build && build.stops.length > 1) {
    for (let i = 0; i < build.stops.length - 1; i++) {
      const a = AP[build.stops[i]], b = AP[build.stops[i + 1]];
      lines.push(h('line', { key: 'b' + i, x1: a.x, y1: a.y, x2: a.x + wrapD(b.x - a.x), y2: b.y, className: 'bline', vectorEffect: 'non-scaling-stroke' }));
    }
    if (build.stops.length >= 3) {
      const a = AP[build.stops[build.stops.length - 1]], b = AP[build.stops[0]];
      lines.push(h('line', { key: 'bc', x1: a.x, y1: a.y, x2: a.x + wrapD(b.x - a.x), y2: b.y, className: 'bline close', vectorEffect: 'non-scaling-stroke' }));
    }
  }

  const buildKey = build ? build.stops.join(',') : '';
  const unlockKey = g.regions.join(",") + "|" + Object.keys(g.built || {}).length;
  const airports = useMemo(() => {
    const kk = view.w / size.w, vhh = kk * size.h;
    const halfW = view.w / 2 + 20 * kk, halfH = vhh / 2 + 20 * kk;
    const must = new Set();
    g.routes.forEach((r) => r.stops.forEach((st) => must.add(st)));
    if (build) build.stops.forEach((st) => must.add(st));
    if (ui.sel) must.add(ui.sel);
    const show = [...must].map((id) => AP[id]);
    const CAP = 240;
    let n = 0;
    for (let i = 0; i < AIRPORTS.length && n < CAP; i++) {      // 配列は重要度順。ズームするほど小さな空港も現れる
      const a = AIRPORTS[i];
      if (must.has(a.id) || !g.regions.includes(a.region)) continue;   // 未解放エリアの空港は表示しない
      if (Math.abs(wrapD(a.x - view.cx)) > halfW || Math.abs(a.y - view.cy) > halfH) continue;
      show.push(a); n++;
    }
    return show.map((a, idx) => {
      const unlocked = g.regions.includes(a.region);
      const bi = build ? build.stops.indexOf(a.id) : -1;
      const sel = ui.sel === a.id;
      const R = (a.demand >= 1.2 ? 5.5 : a.demand >= 0.8 ? 4.5 : 3.5) * kk;
      const label = bi >= 0 || sel || hubIds.has(a.id) || must.has(a.id) || view.w <= 24;
      const x = view.cx + wrapD(a.x - view.cx);
      return h('g', { key: a.id, transform: `translate(${x} ${a.y})`, className: 'ap' + (unlocked ? '' : ' locked') + (unlocked && !ENG.isBuilt(g, a.id) ? ' planned' : '') + (bi >= 0 || sel ? ' on' : ''),
        onClick: () => { if (!gest.current.moved) tapRef.current(a.id); } },
        hubIds.has(a.id) ? h('circle', { r: R * 2, className: 'hubring', strokeWidth: 1.4 * kk }) : null,
        (bi >= 0 || sel) ? h('circle', { r: R * 2.1, className: 'selring', strokeWidth: 1.6 * kk }) : null,
        h('circle', { r: ENG.isBuilt(g, a.id) ? R : R * 0.8, className: 'dot', strokeWidth: 1.4 * kk }),
        label ? h('text', { y: -(R + 4 * kk), fontSize: 10 * kk, className: 'aplabel', strokeWidth: 3 * kk }, a.id) : null,
        bi >= 0 ? h('text', { y: R * 2 + 11 * kk, fontSize: 11 * kk, className: 'apnum', strokeWidth: 3 * kk }, bi + 1) : null,
        h('circle', { r: 15 * kk, className: 'hit' }));
    });
  }, [g, unlockKey, hubKey, view.cx, view.cy, view.w, size.w, size.h, buildKey, ui.sel]);

  const planes = [];
  g.planes.forEach((p) => {
    const r = ENG.routeById(g, p.route);
    if (!r) return;
    const n = r.stops.length, t = TYPE[p.type];
    const A = AP[r.stops[p.leg]], B = AP[r.stops[(p.leg + 1) % n]];
    const bx = A.x + wrapD(B.x - A.x);
    const f = p.phase === 'fly' ? Math.min(1, p.t / legTime(t, dist(A, B))) : 0;
    const gp = p.phase === 'gnd' ? Math.min(1, p.t / groundTime(t)) : 0;        // 地上時間の進み具合 0〜1
    const ang = (Math.atan2(B.y - A.y, bx - A.x) * 180) / Math.PI;
    const rad = (ang * Math.PI) / 180;
    // 地上では少し手前から滑走して離陸位置へ。飛行中は高度に合わせて大きく見える(上昇→巡航→降下)
    const taxi = p.phase === 'gnd' ? -7 * k * (1 - gp * gp) : 0;
    const x = A.x + (bx - A.x) * f + Math.cos(rad) * taxi, y = A.y + (B.y - A.y) * f + Math.sin(rad) * taxi;
    const alt = p.phase === 'gnd' ? 0.8 : 0.8 + 0.45 * Math.sin(Math.PI * f);
    const sc = k * (0.62 + t.tier * 0.045) * alt;
    if (p.phase === 'gnd') {
      planes.push(h('g', { key: 'ring' + p.id, transform: `translate(${A.x} ${A.y})`, className: 'gring' + (gp > 0.9 ? ' full' : '') },
        h('circle', { r: 10 * k, className: 'gring-bg', strokeWidth: 2 }),
        h('circle', { r: 10 * k, className: 'gring-fg', strokeWidth: 2.4, pathLength: 100, strokeDasharray: `${gp * 100} 100`, transform: 'rotate(-90)' }),
        [-1, 0, 1].map((i) => h('circle', { key: i, cx: i * 3.6 * k, cy: 5.5 * k, r: 1.1 * k, className: 'bdot', style: { animationDelay: (i + 1) * 0.25 + 's' } }))));
    }
    if (p.phase === 'gnd' && view.w <= 14 && gp < 0.92) {
      // 拡大時: ターミナル(空港の少し下)から機体へ乗客が列になって乗り込む
      const tx = A.x - 9 * k, ty = A.y + 8 * k;
      for (let i = 0; i < 6; i++) {
        const s = (gp * 7 + i / 6) % 1;
        planes.push(h('circle', { key: 'pax' + p.id + i, cx: tx + (x - tx) * s, cy: ty + (y - ty) * s, r: 0.9 * k, className: 'paxdot', style: { opacity: Math.sin(Math.PI * s) } }));
      }
    }
    planes.push(h('g', { key: p.id, transform: `translate(${x} ${y}) rotate(${ang}) scale(${sc})`, className: 'plane' + (p.phase === 'fly' ? '' : ' ground') },
      h('path', { d: PLANE_SHAPES[shapeOf(t)][0], strokeWidth: 1.2 }), PLANE_SHAPES[shapeOf(t)][1] ? h('path', { d: PLANE_SHAPES[shapeOf(t)][1], className: 'pod', strokeWidth: 0.8 }) : null));
  });

  const areaLabels = h('g', { className: 'arlabels' }, REGIONS.filter((r) => g.regions.includes(r.id) && AREA_LBL[r.id] && (r.group === 'jp' ? view.w <= 90 && view.w > 3.5 : view.w >= 70)).map((r) =>
    h('text', { key: r.id, x: AREA_LBL[r.id].x, y: AREA_LBL[r.id].y, fontSize: (r.group === 'jp' ? 12 : 16) * k, strokeWidth: 4 * k, className: 'arlabel' }, r.name)));
  const offs = OFFSETS.filter((o) => o - 200 < maxX && o + 200 > minX);
  const layers = [
    ...offs.map((o) => h('g', { key: 'm' + o, transform: `translate(${o} 0)` }, h('use', { href: '#land' }), h(AreaLayer, { open: g.regions.join(',') }), h('g', null, lines))),
    h('g', { key: 'airports' }, airports),
    ...offs.map((o) => h('g', { key: 'al' + o, transform: `translate(${o} 0)` }, areaLabels)),
    ...offs.map((o) => h('g', { key: 'p' + o, transform: `translate(${o} 0)` }, planes)),
  ];

  /* 画面座標での浮き文字 */
  const now = Date.now();
  const fx = RT.fx.filter((f) => now - f.born < 1500).map((f) => {
    const px = size.w / 2 + wrapD(f.x - view.cx) / k, py = size.h / 2 + (f.y - view.cy) / k;
    if (px < -40 || px > size.w + 40 || py < -20 || py > size.h + 20) return null;
    return h('span', { key: f.id, className: 'fx' + (f.neg ? ' neg' : ''), style: { left: px, top: py } }, f.text);
  });

  return h('div', { className: 'mapbox', ref: box, onPointerDown: down, onPointerMove: move, onPointerUp: up, onPointerCancel: up, onPointerLeave: up },
    h('svg', { className: 'map', viewBox: `${view.cx - view.w / 2} ${view.cy - vh / 2} ${view.w} ${vh}`, preserveAspectRatio: 'xMidYMid meet', role: 'img', 'aria-label': '世界地図と運航中の路線' },
      h(LandDefs), h(Graticule), layers),
    fx);
}

function RouteCard({ g, r, focused, setUi }) {

  const rate = on.reduce((s, p) => s + ENG.planeRate(g, p), 0);

    h('p', { className: 'sub' }, '総距離 ' + fmtKm(ENG.routeTotal(r)) + ' ・ 最長区間 ' + fmtKm(maxLeg) + ' ・ ' + r.stops.length + '空港'),
    h('div', { className: 'seg wide', role: 'group', 'aria-label': '運賃設定' },
      MODES.map((m, i) => h('button', { key: i, className: r.mode === i ? 'on' : '', onClick: (e) => { e.stopPropagation(); ENG.setMode(r.id, i); } },
        m.name, i === rec ? h('em', null, '推奨') : null))),
    h('p', { className: 'hintline' }, '運賃設定で1周の見込み収益が変わります(標準 ' + fmt(nets[1]) + ' / 推奨 ' + fmt(nets[rec]) + ')'),
    h('div', { className: 'chips' },
      on.map((p) => h('span', { className: 'chip', key: p.id }, TYPE[p.type].name + ' #' + p.id,
        h('button', { 'aria-label': '割り当て解除', onClick: (e) => { e.stopPropagation(); ENG.assignPlane(p.id, null); } }, '×'))),
      on.length < 4 ? h('button', { className: 'btn small', onClick: (e) => { e.stopPropagation(); setOpen(!open); } }, open ? '閉じる' : '＋ 機体を割り当て') : null),

function SavePanel() {
  const [msg, setMsg] = useState('');
  const fileRef = useRef(null);
  const doExport = async () => {
    const d = new Date(), z = (n) => String(n).padStart(2, '0');
    const name = 'skywing-save-' + d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '-' + z(d.getHours()) + z(d.getMinutes()) + '.json';
    const text = ENG.exportSave();
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;   // 公開ページ(ビューア)ではこちら
      if (dl) {
        await dl.save({ filename: name, data: text });
        setMsg('セーブデータを保存しました');
        return;
      }
    } catch (e) {
      if (e && e.code === 'declined') { setMsg('保存をキャンセルしました'); return; }
    }
    try {                                              // 単体のHTMLファイルとして開いた場合
      const blob = new Blob([text], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      setMsg('セーブデータを書き出しました');
    } catch (e) { setMsg('書き出せませんでした'); }
  };
  const doImport = (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => setMsg(ENG.importSave(String(rd.result)) ? '読み込みました。続きから遊べます' : '読み込めませんでした(このゲームのセーブファイルではありません)');
    rd.onerror = () => setMsg('ファイルを開けませんでした');
    rd.readAsText(f);
  };
  return h('div', { className: 'savep' },
    h('h3', { className: 'cd-h' }, 'セーブデータ'),
    h('div', { className: 'savep-row' },
      h('button', { className: 'btn', onClick: doExport }, '↓ 保存(ファイル)'),
      h('button', { className: 'btn', onClick: () => fileRef.current && fileRef.current.click() }, '↑ 読み込み'),

    h('p', { className: 'sub', role: 'status' }, msg || '機種変更やバックアップに使えます。読み込むと現在のデータは置き換わります。'));
}

const FLIP_SET = 'ABCDEFGHJKLMNPRSTUVWXYZ0123456789';
const reduceMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
// 案内板のパタパタ表示: 文字ごとにめくれてから目的の文字に止まる
function FlipText({ text, width, delay, align, tone }) {
  const pad = (t) => (align === 'right' ? t.padStart(width, ' ') : t.padEnd(width, ' ')).slice(0, width);
  const target = pad(String(text));
  const [shown, setShown] = useState(reduceMotion() ? target : ' '.repeat(width));
  useEffect(() => {
    if (reduceMotion()) { setShown(target); return undefined; }
    let tick = -Math.round(delay / 50);
    const id = setInterval(() => {
      tick++;
      if (tick < 0) return;
      let out = '', done = true;
      for (let i = 0; i < width; i++) {
        const ch = target[i];
        if (ch === ' ' || tick >= 4 + i * 2) out += ch;
        else { done = false; out += FLIP_SET[Math.floor(Math.random() * FLIP_SET.length)]; }
      }
      setShown(out);
      if (done) clearInterval(id);
    }, 50);
    return () => clearInterval(id);
  }, [target, delay]);
  return h('span', { className: 'ob-flip ' + (tone || ''), 'aria-label': String(text) },
    [...shown].map((c, i) => h('i', { key: i, 'aria-hidden': true, className: c === ' ' ? 'sp' : (c === shown[i] && c === target[i] ? 'ok' : '') }, c)));
}

              h('div', null, h('dt', null, '搭乗者'), h('dd', null, fmtInt(rep.pax || 0) + '名')),
              h('div', null, h('dt', null, '運航'), h('dd', null, fmtInt(rep.legs) + '便')),
              h('div', null, h('dt', null, 'マイル'), h('dd', null, '+' + fmtInt(rep.miles)))),
            rep.levels > 0 || first ? h('div', { className: 'ob-stamps' },
              rep.levels > 0 ? h('div', { className: 'ob-stamp' }, 'LEVEL UP ', h('b', null, '+' + rep.levels)) : null,
              first ? h('div', { className: 'ob-stamp up' }, 'UPGRADED ', h('b', null, '×2')) : null) : null),
          h('div', { className: 'ob-perf', 'aria-hidden': true }),
          h('div', { className: 'ob-stub' },
            h('div', null, h('small', null, 'FARE ・ 運賃'), h('b', null, (total >= 0 ? '+' : '') + fmt(total))),
            h('div', { className: 'ob-bars', 'aria-hidden': true })))),
      rep.earned > 0 ? h('button', { className: 'ob-up', onClick: upgrade, disabled: first || tear },
        h('span', { className: 'ob-star', 'aria-hidden': true }, first ? '✦' : '▶'),
        h('span', null, first ? 'アップグレード済み' : '広告を見て ×2 アップグレード'),
        h('em', null, first ? '' : '+' + fmt(rep.earned))) : null,
      h('button', { className: 'ob-claim', onClick: claim, disabled: tear }, tear ? 'ご搭乗ありがとうございます' : '切り取って受け取る ✂')));
}

/* ---------------- アプリ本体 ---------------- */
function App() {
  const [, force] = useReducer((x) => x + 1, 0);
  ENG.setBump(force);
  const [boot] = useState(() => ENG.init());
  const g = S.g;
  const [ui, setUiState] = useState({ tab: null, build: null, sel: null, focusRoute: null, modal: boot ? { type: 'offline', rep: boot } : null });
  const uiRef = useRef(null);
  if (uiRef.current === null) uiRef.current = ui;
  // 連続タップでも最新の状態から更新できるよう、同期して持つ
  const setUi = (patch) => { uiRef.current = { ...uiRef.current, ...patch }; setUiState(uiRef.current); };
  const [view, setView] = useState(() => homeView(S.g));

  useEffect(() => {
    let last = Date.now(), lastSave = Date.now();
    const id = setInterval(() => {
      const now = Date.now(), dt = (now - last) / 1000;
      last = now;
      if (dt > 4) { const rep = ENG.catchUp(dt); if (dt >= 60) setUi({ modal: { type: 'offline', rep } }); }
      else ENG.advance(dt * S.g.speed);
      if (now - lastSave > 5000) { ENG.save(); lastSave = now; }
      force();
    }, 100);
    const hide = () => { if (document.hidden) ENG.save(); };
    document.addEventListener('visibilitychange', hide);
    window.addEventListener('pagehide', ENG.save);
    return () => { clearInterval(id); document.removeEventListener('visibilitychange', hide); window.removeEventListener('pagehide', ENG.save); };
  }, []);

  function tapAirport(id) {
    const a = AP[id], u = uiRef.current, gg = S.g;
    const open = gg.regions.includes(a.region);
    if (u.build) {
      if (!open) { toast(REGION[a.region].name + 'はまだ就航エリアではありません。「世界」タブで解禁できます', 'warn'); return; }
      if (!ENG.isBuilt(gg, id)) { toast(a.name + 'はまだ建設されていません。先に空港をタップして建設してください', 'warn'); return; }
      const st = u.build.stops;
      if (st.includes(id)) setUi({ build: { stops: st.filter((x) => x !== id) } });
      else if (st.length >= 5) toast('1つの路線に入れられる空港は5か所までです', 'warn');
      else {
        const why = ENG.routeCheck(gg, [...st, id], false);
        if (why) toast(why, 'warn'); else setUi({ build: { stops: [...st, id] } });
      }
    } else setUi({ sel: u.sel === id ? null : id, tab: null });
  }
  function pickAirport(id) {                      // 検索結果から選ぶ: 地図をその空港へ移して選択
    const a = AP[id];
    setView((v) => ({ cx: a.x, cy: clamp(a.y, -95, 62), w: Math.min(v.w, 22) }));
    if (uiRef.current.build) { tapAirport(id); setUi({ tab: null }); }
    else setUi({ sel: id, tab: null });
  }
  const startBuild = () => setUi({ build: { stops: [] }, tab: null, sel: null });
  const zoom = (f) => setView((v) => ({ ...v, w: clamp(v.w * f, 3.5, 360) }));
  const tabTo = (t) => setUi({ tab: uiRef.current.tab === t ? null : t, sel: null, build: null });
  const closeSheet = () => setUi({ tab: null });

  const lo = xpToReach(g.level), hi = xpToReach(g.level + 1);
  const pct = clamp((g.xp - lo) / (hi - lo), 0, 1);
  const rate = ENG.totalRate(g) * g.speed;
  const active = g.planes.filter((p) => p.route).length;
  const now = Date.now();
  const toasts = RT.toasts.filter((t) => t.until > now);

  const sheet = ui.tab === 'fleet' ? h(FleetSheet, { g, setUi, close: closeSheet })
    : ui.tab === 'routes' ? h(RoutesSheet, { g, ui, setUi, close: closeSheet, startBuild })
    : ui.tab === 'store' ? h(StoreSheet, { g, close: closeSheet })
    : ui.tab === 'world' ? h(WorldSheet, { g, setUi, close: closeSheet })
    : ui.tab === 'search' ? h(SearchSheet, { g, ui, setUi, close: closeSheet, onPick: pickAirport }) : null;

  const navItem = (id, label, ic) => h('button', { key: id, className: 'nav-btn' + ((ui.tab === id || (id === 'home' && !ui.tab)) ? ' on' : ''), onClick: () => (id === 'home' ? setUi({ tab: null, sel: null }) : tabTo(id)), 'aria-current': (ui.tab === id || (id === 'home' && !ui.tab)) ? 'page' : undefined }, icon(ic), h('span', null, label));

  return h('div', { className: 'app' },
    h('header', { className: 'hud' }, h('div', { className: 'band-in hud-in' },
      h('button', { className: 'ring', style: { '--p': pct * 360 + 'deg' }, 'aria-label': '会社ダッシュボードを開く', onClick: () => setUi({ modal: { type: 'company' } }) }, h('span', null, g.level), h('small', null, 'LV')),
      h('div', { className: 'who' }, h('div', { className: 'airline' }, g.name), h('div', { className: 'miles' }, 'マイル ', h('b', null, fmtInt(g.miles)))),
      h('div', { className: 'cash' }, h('small', null, '資金'), h('b', null, fmt(g.money))),
      h('button', { className: 'iconbtn', 'aria-label': '設定', onClick: () => setUi({ modal: { type: 'settings' } }) }, icon('sliders')))),
    h('main', { className: 'stage' },
      h(MapView, { g, ui, view, setView, onTap: tapAirport }),
      h('div', { className: 'ov left' },
        h('div', { className: 'seg', role: 'group', 'aria-label': '速度' }, [1, 2, 10].map((v) => h('button', { key: v, className: g.speed === v ? 'on' : '', onClick: () => ENG.setSpeed(v) }, v + '×'))),
        h('div', { className: 'pill clock' }, h('span', null, g.year + '年' + (ENG.boostOf(g) ? ' ・ ' + ENG.boostOf(g).label + ' ×' + ENG.boostOf(g).mult : '')), h('b', null, ENG.clockText(g))),
        h('button', { className: 'pill scn', onClick: () => setUi({ modal: { type: 'scenario' } }) },
          (() => {
            const fid = ENG.focusChapter(g), c = fid && STORY.byId[fid];
            if (!c) return h('span', null, 'シナリオを見る');
            const st = ENG.chState(g, fid), step = c.steps[st.i], p = ENG.goalProgress(g, fid, step.main);
            return [h('span', { key: 's' }, '第' + c.no + '章 ' + (st.i + 1) + '/' + c.steps.length + ' ・ ' + ENG.goalText(step.main)), h('i', { key: 'p', className: 'scn-bar' }, h('u', { style: { width: Math.round(p.cur / p.max * 100) + '%' } }))];
          })()),        h('div', { className: 'pill' }, h('span', null, active + '/' + g.planes.length + '機 運航'), h('b', { className: rate < 0 ? 'neg' : '' }, fmt(rate) + '/分'))),
      h('div', { className: 'ov right' },
        h('button', { className: 'iconbtn', onClick: () => setUi({ tab: uiRef.current.tab === 'search' ? null : 'search', sel: null }), 'aria-label': '空港を検索' }, icon('search')),
        h('button', { className: 'iconbtn', onClick: () => zoom(1 / 1.5), 'aria-label': '拡大' }, icon('plus')),
        h('button', { className: 'iconbtn', onClick: () => zoom(1.5), 'aria-label': '縮小' }, icon('minus')),
        h('button', { className: 'iconbtn', onClick: () => setView(homeView(S.g)), 'aria-label': '日本へ戻る' }, icon('target'))),
      h('div', { className: 'toasts', 'aria-live': 'polite' }, toasts.map((t) => h('div', { key: t.id, className: 'toast ' + t.kind }, t.text))),
      ui.build ? h(BuildBar, { g, ui, setUi })
        : (ui.sel && !ui.tab) ? h(AirportCard, { g, ui, setUi })
        : (g.hint && !ui.tab) ? h(HintCard, { g, setUi }) : null,
      sheet),
    h('nav', { className: 'nav', 'aria-label': 'メインメニュー' }, h('div', { className: 'band-in nav-in' },
      navItem('home', 'ホーム', 'home'), navItem('fleet', '機体', 'fleet'), navItem('routes', '路線', 'routes'), navItem('store', 'ストア', 'store'), navItem('world', '世界', 'world'))),
    ui.modal && ui.modal.type === 'settings' ? h(SettingsModal, { g, onClose: () => setUi({ modal: null }) }) : null,
    (RT.chapq.length && !ui.modal) ? h(ChapterCard, { key: RT.chapq[0].kind + RT.chapq[0].id, info: RT.chapq[0], g, onClose: () => { RT.chapq.shift(); setUi({}); }, goWorld: () => { RT.chapq.shift(); setUi({ tab: 'world', sel: null, build: null }); } }) : null,
    (RT.storyq.length && !ui.modal && !RT.chapq.length) ? h(StoryCard, { key: 'st' + RT.storyq[0].title, info: RT.storyq[0], onClose: () => { RT.storyq.shift(); setUi({}); } }) : null,
    ui.modal && ui.modal.type === 'scenario' ? h(ScenarioModal, { g, onClose: () => setUi({ modal: null }) }) : null,
    (RT.apq.length && !ui.modal && !RT.storyq.length && !RT.chapq.length) ? h(AirportBuild, { key: 'ap' + RT.apq[0].id + RT.apq[0].to, info: RT.apq[0], onClose: () => { RT.apq.shift(); setUi({}); } }) : null,
    (RT.lvq.length && !ui.modal && !RT.storyq.length && !RT.chapq.length && !RT.apq.length) ? h(LevelUp, { key: RT.lvq[0].level, info: RT.lvq[0], onClose: () => { RT.lvq.shift(); setUi({}); } }) : null,
    ui.modal && ui.modal.type === 'company' ? h(CompanyModal, { g, onClose: () => setUi({ modal: null }) }) : null,
    ui.modal && ui.modal.type === 'offline' ? h(OfflineModal, { rep: ui.modal.rep, onClose: () => setUi({ modal: null }) }) : null);
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));

</script>
